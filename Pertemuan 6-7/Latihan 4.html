<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Interaktif</title>
    <link rel="stylesheet" href="assets/css/Latihan 4.css">
</head>
<body>

    <div class="card">
        <!-- Header Halaman -->
        <h2 id="title-text">Form Pendaftaran Account</h2>
        <p class="subtitle">Silakan isi formulir di bawah ini dengan benar.</p>

        <!-- Container Pesan Error / Sukses -->
        <div id="alert-box" class="alert hidden"></div>

        <!-- Form Registrasi -->
        <form id="registration-form" novalidate>
            <!-- Input Nama -->
            <div class="form-group">
                <label for="fullName">Nama Lengkap</label>
                <input type="text" id="fullName" placeholder="Masukkan nama Anda">
            </div>

            <!-- Input Email -->
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="contoh@domain.com">
            </div>

            <!-- Input Password -->
            <div class="form-group">
                <label for="password">Password (Min. 8 Karakter)</label>
                <input type="password" id="password" placeholder="Masukkan password">
                <!-- Live preview jumlah karakter (Event Keyup) -->
                <small id="char-counter" class="info-text">Panjang password: 0 karakter</small>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" id="submit-btn">Daftar Sekarang</button>
        </form>
    </div>

    <script src="assets/js/Latihan 4.js"></script>
</body>
</html>
